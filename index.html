<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وتحليل نتائج الطلاب</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body>

    <div class="container">
        <div class="card-container">
            <!--ايقونه شعار الدلتا-->
            <img src="assets/logo.png" class="top-right-icon" alt="icon">
        <h1>🎓 نظام إدارة وتحليل نتائج الطلاب</h1>
        <p class="subtitle">مشروع متكامل يدمج HTML, CSS, JavaScript (افتحي الـ Console لرؤية التقارير البرمجية بالضغط علي ctrl+shift+i)</p>

        <!-- أزرار التحكم -->
        <div class="control-panel">
            <button onclick="displayGeneralReport()" class="btn btn-primary">عرض تقرير العام للطلاب </button>
            <button onclick="applyGracePeriod()" class="btn btn-danger"> تشغيل لجنة الرأفة</button>
        </div>

        <!-- قسم عرض النتائج -->
        <div id="output-section" class="output-card hidden">
            <h2 id="table-title"> نتائج المعالجة:</h2>
            <div class="table-responsive">
                <table id="results-table">
                    <thead>
                        <!--  هيعبئ العناوين تلقائياً عبر الجافا سكريبت -->
                    </thead>
                    <tbody id="table-body">
                        <!-- سيتم تعبئة البيانات هنا تلقائياً -->
                    </tbody>
                </table>
            </div>
            
            <!-- صندوق الإحصائيات الخاصة بالرأفة -->
            <div id="stats-box" class="stats-box hidden">
                <!-- سيظهر هنا المتوسط العام بعد التعديل -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
